# docs/app/catalog.json から scripts/build-mock-diff-workspace.py が生成する。
# 直接編集しても次の撮影で上書きされる。
#
# 候補は Apple Music の実機撮影 1 つだけなので、選定フェーズは実質的に済んでいて、
# 使うのは「選ばれた設計と実装を突き合わせる」3 番目のフェーズだけ。
# ステータスバーは両側とも生成時に黒で塗り潰してある。
screens:
  - id: home
    name: "Home"
    category: "Home"
    devices:
      - id: iPad
        name: iPad
        viewport:
          width: 1024
          height: 1366
          deviceScaleFactor: 2
        orientations: [landscape]
        versions:
          apple-music:
            type: png
            path: designs/iPad/home.png
        actual:
          type: png
          path: actual/iPad/home.png
      - id: iPhone
        name: iPhone
        viewport:
          width: 393
          height: 852
          deviceScaleFactor: 3
        versions:
          apple-music:
            type: png
            path: designs/iPhone/home.png
        actual:
          type: png
          path: actual/iPhone/home.png

