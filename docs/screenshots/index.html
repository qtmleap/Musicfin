<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musicfin Versions</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#09090b;--muted:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--accent:#e11d48} @media(prefers-color-scheme:dark){:root{--bg:#09090b;--fg:#fafafa;--muted:#a1a1aa;--line:#27272a;--soft:#18181b;--accent:#fb7185}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}button,a{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 12px;cursor:pointer}button:hover,a:hover{background:var(--soft)}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px)}h1,h2,h3,p{margin:0}h1{font-size:18px}.meta{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 65px)}nav{padding:16px 10px;border-right:1px solid var(--line);overflow:auto}.nav-link{display:block;width:100%;border:0;text-align:left;color:var(--muted)}.nav-link.active{background:var(--soft);color:var(--fg);font-weight:600}main{padding:24px clamp(16px,3vw,40px) 60px;min-width:0}.title-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.shot{min-width:0}.label{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:600}.label small{font-weight:400;color:var(--muted)}.frame{display:block;width:100%;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:var(--soft);aspect-ratio:var(--ratio,1206/2622);cursor:zoom-in}.frame img{display:block;width:100%;height:100%;object-fit:contain}.missing{display:grid;place-items:center;height:100%;color:var(--muted)}.metrics{margin-top:16px;padding-block:14px;border-block:1px solid var(--line);color:var(--muted);font:12px ui-monospace,monospace}.good{color:#16a34a}.bad{color:#e11d48}dialog{width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:14px;background:var(--bg);color:var(--fg)}dialog[open]{display:flex;flex-direction:column;gap:12px}.viewer-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}.viewer-head h2{margin-right:auto}.modes{display:flex;gap:4px;flex-wrap:wrap}.modes button.active{background:var(--soft)}.stage{flex:1;min-height:0;display:grid;place-items:center}.stage img{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:7px}.status{padding:20px;border-block:1px solid var(--line);color:var(--muted)}@media(max-width:760px){.layout{display:block}nav{display:flex;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.nav-link{width:auto;white-space:nowrap}.columns{grid-template-columns:1fr}.title-row{align-items:start;flex-direction:column}main{padding:18px 16px 40px}.viewer-head{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<header><div><h1>Musicfin Versions</h1><p class="meta" id="meta">読み込み中…</p></div><button id="reload">更新</button></header>
<div class="layout"><nav id="nav"></nav><main id="main"><p class="status">manifestを読み込んでいます…</p></main></div>
<dialog id="viewer"><div class="viewer-head"><h2 id="viewer-title"></h2><div class="modes" id="modes"></div><button id="close">閉じる</button></div><div class="stage" id="stage"></div><p class="meta" id="path"></p></dialog>
<script>
'use strict';
const titles={'login-server':'Server','login-credentials':'Sign In','login-quickconnect':'Quick Connect',account:'Account',home:'Home',library:'Library',albums:'Albums',album:'Album',artists:'Artists',artist:'Artist',playlists:'Playlists',playlist:'Playlist',genres:'Genres',songs:'Songs',favorites:'Favorite Songs',miniplayer:'Mini Player',nowplaying:'Now Playing',lyrics:'Lyrics',queue:'Up Next','search-idle':'Search','search-typing':'Search Input',search:'Search Results'};
const order=['login-server','login-credentials','login-quickconnect','account','home','library','albums','album','artists','artist','playlists','playlist','genres','songs','favorites','miniplayer','nowplaying','lyrics','queue','search-idle','search-typing','search'];
const $=id=>document.getElementById(id); let data={},screens=[],selected='home',zoom=null;
const bust=(path,stamp)=>`${path}?v=${encodeURIComponent(stamp||Date.now())}`;
async function manifest(path){const r=await fetch(bust(path,Date.now()),{cache:'no-store'});if(!r.ok)throw Error(`${path}: HTTP ${r.status}`);return r.json()}
function mapShots(m){return new Map((m.shots||[]).map(s=>[s.screen,s.path]))}
function refMap(m){return new Map((m.screens||[]).map(s=>typeof s==='string'?[s,`${s}.png`]:[s.id,s.path||`${s.id}.png`]))}
function imagePath(source,screen){if(source==='previous'){const p=data.previousShots.get(screen);return p&&bust(`previous/${p}`,data.previous.generatedAt)}if(source==='current'){const p=data.currentShots.get(screen);return p&&bust(`current/${p}`,data.current.generatedAt)}if(source==='reference'){const p=data.referenceShots.get(screen);return p&&bust(`reference/${p}`,data.reference.generatedAt)}return `comparison/${screen}/${source}.png?v=${encodeURIComponent(data.comparison?.generatedAt||Date.now())}`}
const versionLabel=version=>version?(/^v|^\D/.test(version)?version:`v${version}`):'—';
function shot(source,screen,label){const box=document.createElement('section');box.className='shot';box.innerHTML=`<p class="label"><span>${label}</span></p>`;const b=document.createElement('button');b.className='frame';const p=imagePath(source,screen);if(!p)b.innerHTML='<span class="missing">No screenshot</span>';else{const img=new Image();img.alt=`${titles[screen]||screen} ${label}`;img.onload=()=>b.style.setProperty('--ratio',`${img.naturalWidth}/${img.naturalHeight}`);img.src=p;b.append(img);b.onclick=()=>openViewer(screen,source)}box.append(b);return box}
function render(){const nav=$('nav');nav.replaceChildren(...screens.map(s=>{const b=document.createElement('button');b.className=`nav-link ${s===selected?'active':''}`;b.textContent=titles[s]||s;b.onclick=()=>{selected=s;location.hash=encodeURIComponent(s);render()};return b}));const main=$('main');main.replaceChildren();const head=document.createElement('div');head.className='title-row';head.innerHTML=`<div><h2>${titles[selected]||selected}</h2><p class="meta">${selected}</p></div>`;main.append(head);const cols=document.createElement('div');cols.className='columns';cols.append(shot('previous',selected,versionLabel(data.previous.version)),shot('current',selected,versionLabel(data.current.version)),shot('reference',selected,'Apple Music'));main.append(cols);const m=data.metrics?.get(selected);if(m){const d=m.ssimDelta;const p=document.createElement('p');p.className='metrics';p.innerHTML=`Apple similarity · SSIM ${m.currentReference.ssim?.toFixed(4)??'—'} · Δ <span class="${d>0?'good':d<0?'bad':''}">${d==null?'—':(d>=0?'+':'')+d.toFixed(4)}</span> · PSNR ${m.currentReference.psnr?.toFixed(2)??'—'} dB`;main.append(p)}}
function modes(){return [['previous',versionLabel(data.previous.version)],['current',versionLabel(data.current.version)],['reference','Apple Music'],['overlay','Overlay'],['difference','Difference']]}function openViewer(screen,mode){zoom={screen,mode};renderViewer();$('viewer').showModal()}function renderViewer(){const {screen,mode}=zoom;$('viewer-title').textContent=titles[screen]||screen;$('modes').replaceChildren(...modes().map(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=id===mode?'active':'';b.onclick=()=>{zoom.mode=id;renderViewer()};return b}));const p=imagePath(mode,screen),img=new Image();img.src=p||'';img.alt=`${screen} ${mode}`;$('stage').replaceChildren(p?img:Object.assign(document.createElement('p'),{textContent:'No screenshot'}));$('path').textContent=p||'No screenshot'}
async function load(){try{const [previous,current,reference,comparison]=await Promise.all([manifest('previous/manifest.json'),manifest('current/manifest.json'),manifest('reference/manifest.json'),manifest('comparison/manifest.json').catch(()=>null)]);data={previous,current,reference,comparison,previousShots:mapShots(previous),currentShots:mapShots(current),referenceShots:refMap(reference),metrics:new Map((comparison?.screens||[]).map(s=>[s.id,s.metrics]))};screens=[...new Set([...order,...data.currentShots.keys(),...data.previousShots.keys(),...data.referenceShots.keys()])].filter(s=>data.currentShots.has(s)||data.previousShots.has(s)||data.referenceShots.has(s));selected=decodeURIComponent(location.hash.slice(1))||'home';if(!screens.includes(selected))selected=screens[0];$('meta').textContent=`${previous.version||'previous'} → ${current.version||'current'} · en_US · dark`;render()}catch(e){$('main').innerHTML=`<p class="status">${e.message}</p>`}}
$('reload').onclick=load;$('close').onclick=()=>$('viewer').close();window.onhashchange=()=>{const s=decodeURIComponent(location.hash.slice(1));if(screens.includes(s)){selected=s;render()}};window.onkeydown=e=>{if(!$('viewer').open)return;if(e.key==='Escape')$('viewer').close();const map={'1':'previous','2':'current','3':'reference',o:'overlay',O:'overlay',d:'difference',D:'difference'};if(map[e.key]){zoom.mode=map[e.key];renderViewer()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){let i=screens.indexOf(zoom.screen);i=(i+(e.key==='ArrowRight'?1:-1)+screens.length)%screens.length;zoom.screen=screens[i];renderViewer()}};load();
</script>
</body>
</html>
