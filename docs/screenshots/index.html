<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musicfin UI Catalog — iPhone</title>
<style>
:root{--background:0 0% 100%;--foreground:222.2 84% 4.9%;--card:0 0% 100%;--card-foreground:222.2 84% 4.9%;--muted:210 40% 96.1%;--muted-foreground:215.4 16.3% 46.9%;--border:214.3 31.8% 91.4%;--accent:210 40% 96.1%;--accent-foreground:222.2 47.4% 11.2%;--primary:222.2 47.4% 11.2%;--primary-foreground:210 40% 98%;--warning:32 95% 44%;--radius:.5rem;color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}@media(prefers-color-scheme:dark){:root{--background:222.2 84% 4.9%;--foreground:210 40% 98%;--card:222.2 84% 4.9%;--card-foreground:210 40% 98%;--muted:217.2 32.6% 17.5%;--muted-foreground:215 20.2% 65.1%;--border:217.2 32.6% 17.5%;--accent:217.2 32.6% 17.5%;--accent-foreground:210 40% 98%;--primary:210 40% 98%;--primary-foreground:222.2 47.4% 11.2%;color-scheme:dark}}*{box-sizing:border-box}html,body{margin:0;height:100%;background:hsl(var(--background));color:hsl(var(--foreground))}button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid hsl(var(--foreground));outline-offset:2px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);height:100dvh}aside{min-width:0;border-right:1px solid hsl(var(--border));overflow:auto;padding:.875rem .625rem;background:hsl(var(--card))}.brand{display:flex;align-items:center;gap:.625rem;padding:.25rem .5rem 1rem;font-weight:650;font-size:.9375rem}.mark{display:grid;place-items:center;width:1.75rem;height:1.75rem;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-size:.75rem;font-style:normal}#search{width:100%;height:2.25rem;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--background));padding:0 .75rem;font-size:.8125rem}.category{margin:1rem .5rem .375rem;color:hsl(var(--muted-foreground));font-size:.6875rem;font-weight:600;letter-spacing:.04em}.story{display:block;width:100%;border:0;border-radius:calc(var(--radius) - 2px);background:transparent;text-align:left;padding:.4375rem .5rem;cursor:pointer;font-size:.8125rem;color:hsl(var(--muted-foreground))}.story:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}.story.active{background:hsl(var(--accent));color:hsl(var(--accent-foreground));font-weight:550}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}header{display:flex;align-items:center;gap:.5rem;min-height:3.5rem;border-bottom:1px solid hsl(var(--border));padding:.625rem 1rem;background:hsl(var(--background))}.crumb{min-width:8rem;margin-right:auto}.crumb b{display:block;font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb span{display:block;color:hsl(var(--muted-foreground));font-size:.6875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.control{display:flex;align-items:center;padding:.1875rem;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--muted))}.control button{height:1.875rem;border:0;border-radius:calc(var(--radius) - 3px);background:transparent;padding:0 .625rem;cursor:pointer;color:hsl(var(--muted-foreground));font-size:.75rem}.control button:hover{color:hsl(var(--foreground))}.control button.active{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px rgb(0 0 0/.08)}.icon-button{height:2.25rem;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--background));padding:0 .7rem;cursor:pointer;font-size:.75rem}.workspace{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.75rem;padding:.75rem 1rem 1rem;overflow:hidden}.notes{margin:0;color:hsl(var(--muted-foreground));font-size:.75rem}.compare{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.pane{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card));overflow:hidden}.pane[hidden]{display:none}.pane-head{display:flex;justify-content:space-between;gap:1rem;align-items:center;border-bottom:1px solid hsl(var(--border));padding:.5rem .75rem}.pane-head b{font-size:.75rem}.pane-head span{color:hsl(var(--muted-foreground));font-size:.6875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{position:relative;min-width:0;min-height:0;overflow:auto;display:grid;place-items:start center;padding:.75rem;background:repeating-conic-gradient(hsl(var(--muted)) 0 25%,hsl(var(--background)) 0 50%) 50%/12px 12px;overscroll-behavior:contain}.frame img,.frame canvas{display:block;flex:none;max-width:none;height:auto}.frame img[hidden]{display:none}.missing{place-self:center;padding:2rem;text-align:center;color:hsl(var(--warning));font-size:.75rem}#compositePane{display:none;grid-column:1/-1}.metrics{min-height:1rem;color:hsl(var(--muted-foreground));font:11px ui-monospace,SFMono-Regular,monospace}.status{position:fixed;left:50%;bottom:1rem;z-index:5;translate:-50% 0;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--foreground));color:hsl(var(--background));padding:.5rem .75rem;font-size:.75rem;box-shadow:0 4px 18px rgb(0 0 0/.2)}.status:empty{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto;min-height:100dvh}aside{max-height:32dvh;border-right:0;border-bottom:1px solid hsl(var(--border))}main{min-height:68dvh}header{flex-wrap:wrap}.workspace{min-height:68dvh}}@media(max-width:640px){.compare{grid-template-columns:1fr;overflow:auto}.pane{min-height:56dvh}#compositePane{grid-column:auto}.control button{padding-inline:.45rem}.workspace{overflow:auto}}
</style></head>
<body><div class="shell"><aside><div class="brand"><i class="mark">MF</i>UI Catalog</div><input id="search" type="search" placeholder="Search stories…" aria-label="ストーリーを検索"><nav id="stories" aria-label="UI stories"></nav></aside><main><header><div class="crumb"><b id="title"></b><span id="path"></span></div><div class="control" id="devices" aria-label="Device"><button data-device="iPhone">iPhone</button><button data-device="iPad">iPad</button></div><div class="control" id="modes" aria-label="Comparison mode"><button data-mode="side">Side</button><button data-mode="overlay">Overlay</button><button data-mode="difference">Diff</button></div><div class="control" id="zooms" aria-label="Zoom"><button data-zoom="fit">Fit</button><button data-zoom="0.5">50%</button><button data-zoom="1">100%</button><button data-zoom="2">200%</button></div><button class="icon-button" id="sync" aria-pressed="true">Linked</button></header><div class="workspace"><p class="notes" id="description"></p><div class="compare"><section class="pane" id="currentPane"><div class="pane-head"><b>Musicfin</b><span id="currentLabel"></span></div><div class="frame" id="currentFrame" tabindex="0"><div class="missing" id="missing">撮影画像がありません</div><img id="current" alt="Musicfin current"></div></section><section class="pane" id="referencePane"><div class="pane-head"><b>Apple Music</b><span>iPhone reference</span></div><div class="frame" id="referenceFrame" tabindex="0"><img id="reference" alt="Apple Music reference"></div></section><section class="pane" id="compositePane"><div class="pane-head"><b id="compositeTitle"></b><span>Musicfin dimensions</span></div><div class="frame" id="compositeFrame" tabindex="0"><canvas id="composite"></canvas></div></section></div><div class="metrics" id="metrics" aria-live="polite"></div></div></main></div><div class="status" id="status" role="status" aria-live="polite"></div>
<script>
const stories=[{"id": "home", "category": "Home", "title": "Home", "description": "ホームの通常表示", "reference": "references/home.webp", "current": "current/home.png", "capture": "home", "counterpart": "iPad"}, {"id": "apple-account-sheet", "category": "Account", "title": "Apple Account", "description": "Apple Accountのフルハイトシート", "reference": "references/apple-account-sheet.webp", "current": null, "capture": null, "counterpart": null}, {"id": "library", "category": "Library", "title": "Library", "description": "ライブラリのルート", "reference": "references/library.webp", "current": "current/library.png", "capture": "library", "counterpart": null}, {"id": "library-playlists", "category": "Library", "title": "Playlists", "description": "プレイリスト一覧", "reference": "references/library-playlists.webp", "current": "current/playlists.png", "capture": "playlists", "counterpart": null}, {"id": "library-artists", "category": "Library", "title": "Artists", "description": "アーティスト一覧", "reference": "references/library-artists.webp", "current": "current/artists.png", "capture": "artists", "counterpart": null}, {"id": "library-albums", "category": "Library", "title": "Albums", "description": "アルバム一覧", "reference": "references/library-albums.webp", "current": "current/albums.png", "capture": "albums", "counterpart": "iPad"}, {"id": "library-downloaded", "category": "Library", "title": "Downloaded", "description": "ダウンロード済みのルート", "reference": "references/library-downloaded.webp", "current": null, "capture": null, "counterpart": null}, {"id": "album-detail-cosmic-princess-kaguya", "category": "Album", "title": "Cosmic Princess Kaguya", "description": "アルバム詳細", "reference": "references/album-detail-cosmic-princess-kaguya.webp", "current": "current/album.png", "capture": "album", "counterpart": "iPad"}, {"id": "now-playing-controls", "category": "Now Playing", "title": "Controls", "description": "メイン再生コントロール", "reference": "references/now-playing-controls.webp", "current": "current/nowplaying.png", "capture": "nowplaying", "counterpart": "iPad"}, {"id": "now-playing-queue", "category": "Now Playing", "title": "Queue", "description": "次に再生する曲のパネル", "reference": "references/now-playing-queue.webp", "current": "current/queue.png", "capture": "queue", "counterpart": "iPad"}, {"id": "now-playing-output-picker", "category": "Now Playing", "title": "Output Picker", "description": "出力先選択ポップオーバー", "reference": "references/now-playing-output-picker.webp", "current": null, "capture": null, "counterpart": null}, {"id": "now-playing-lyrics-loading", "category": "Now Playing", "title": "Lyrics — Loading", "description": "歌詞の読み込み状態", "reference": "references/now-playing-lyrics-loading.webp", "current": "current/lyrics-loading.png", "capture": "lyrics-loading", "counterpart": "iPad"}, {"id": "now-playing-lyrics", "category": "Now Playing", "title": "Lyrics", "description": "同期歌詞の表示状態", "reference": "references/now-playing-lyrics.webp", "current": "current/lyrics.png", "capture": "lyrics", "counterpart": "iPad"}],device="iPhone",nav=document.querySelector('#stories');let selected,mode='side',zoom='fit',linked=true,scrollLock=false;
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);mode=['side','overlay','difference'].includes(params.get('mode'))?params.get('mode'):'side';zoom=['fit','0.5','1','2'].includes(params.get('zoom'))?params.get('zoom'):'fit';
function groups(list){const result=new Map;for(const s of list){if(!result.has(s.category))result.set(s.category,[]);result.get(s.category).push(s)}return result}
function notify(text){$('status').textContent=text;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('status').textContent='',3000)}
function saveState(){const p=new URLSearchParams;p.set('mode',mode);p.set('zoom',zoom);if(device==='iPhone'&&new URLSearchParams(location.search).get('device')==='iphone')p.set('device','iphone');history.replaceState(null,'',`${location.pathname}?${p}#${selected.id}`)}
function renderNav(query=''){nav.innerHTML='';const filtered=stories.filter(s=>(s.title+' '+s.id+' '+s.category).toLowerCase().includes(query.toLowerCase()));for(const [category,items] of groups(filtered)){const h=document.createElement('div');h.className='category';h.textContent=category;nav.append(h);for(const s of items){const b=document.createElement('button');b.className='story'+(selected?.id===s.id?' active':'');b.textContent=s.title;b.setAttribute('aria-current',selected?.id===s.id?'page':'false');b.onclick=()=>openStory(s.id);nav.append(b)}}}
async function openStory(id){selected=stories.find(s=>s.id===id)||stories[0];if(!selected)return;const canvas=$('composite');canvas.width=0;canvas.height=0;$('title').textContent=selected.title;$('path').textContent=selected.category+' / '+selected.id;$('description').textContent=selected.description;$('reference').src=selected.reference;const current=$('current'),missing=$('missing');if(selected.current){current.hidden=false;missing.hidden=true;current.src=selected.current;current.onerror=()=>{current.hidden=true;selected.current=null;missing.hidden=false;missing.textContent='Musicfin capture missing: '+selected.capture+'.png';setMode('side')}}else{current.hidden=true;current.removeAttribute('src');missing.hidden=false;missing.textContent='Apple Music reference only'}$('currentLabel').textContent=selected.capture||'reference only';renderNav($('search').value);saveState();await Promise.allSettled([$ ('reference').decode(),current.hidden?Promise.resolve():current.decode()]);setMode(mode);applyZoom()}
async function drawComposite(kind){const a=$('current'),b=$('reference');if(a.hidden)return;try{await Promise.all([a.decode(),b.decode()]);if(a.naturalWidth!==b.naturalWidth||a.naturalHeight!==b.naturalHeight){const message=`画像サイズが異なるため比較できません: Musicfin ${a.naturalWidth}×${a.naturalHeight} / Apple Music ${b.naturalWidth}×${b.naturalHeight}`;setMode('side');$('metrics').textContent=message;notify(message);return}const c=$('composite'),ctx=c.getContext('2d'),w=a.naturalWidth,h=a.naturalHeight;c.width=w;c.height=h;ctx.drawImage(a,0,0,w,h);if(kind==='overlay'){ctx.globalAlpha=.5;ctx.drawImage(b,0,0);ctx.globalAlpha=1;$('metrics').textContent='Overlay opacity 50%'}else{const left=ctx.getImageData(0,0,w,h);ctx.clearRect(0,0,w,h);ctx.drawImage(b,0,0);const right=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);let total=0,changed=0;for(let i=0;i<out.data.length;i+=4){let hit=false;for(let j=0;j<3;j++){const d=Math.abs(left.data[i+j]-right.data[i+j]);out.data[i+j]=Math.min(255,d*4);total+=d;if(d>8)hit=true}out.data[i+3]=255;if(hit)changed++}ctx.putImageData(out,0,0);$('metrics').textContent='RGB MAE '+(total/(w*h*3*255)).toFixed(5)+' · mismatch >8 '+(changed/(w*h)*100).toFixed(2)+'%'}applyZoom()}catch(e){setMode('side');$('metrics').textContent='比較画像を読み込めません: '+e.message}}
function setMode(next){if(next!=='side'&&!selected?.current){next='side';notify('Musicfinの撮影画像がないためSide表示に戻しました')}mode=next;document.querySelectorAll('#modes button').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});const composite=mode!=='side';$('currentPane').hidden=composite;$('referencePane').hidden=composite;$('compositePane').style.display=composite?'grid':'none';$('metrics').textContent=selected?.current?'':'Musicfinの対応キャプチャがないため参照のみ表示';saveState();if(composite){$('compositeTitle').textContent=mode==='overlay'?'Overlay':'Pixel difference';drawComposite(mode)}else applyZoom()}
function fitSize(el,frame){if(!el.naturalWidth&&!el.width)return;const w=el.naturalWidth||el.width,h=el.naturalHeight||el.height,scale=Math.min(1,(frame.clientWidth-24)/w,(frame.clientHeight-24)/h);el.style.width=Math.max(1,w*scale)+'px'}
function applyZoom(){document.querySelectorAll('#zooms button').forEach(b=>{const active=b.dataset.zoom===zoom;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});const pairs=[[$('current'),$('currentFrame')],[$('reference'),$('referenceFrame')],[$('composite'),$('compositeFrame')]];for(const [el,frame] of pairs){if(zoom==='fit')fitSize(el,frame);else{const w=el.naturalWidth||el.width;if(w)el.style.width=w*Number(zoom)+'px'}}saveState()}
function switchDevice(target){if(target===device)return;const base=target==='iPhone'?'../?device=iphone&':'ipad-report/?';const destination=selected.counterpart?selected.id:'home';if(!selected.counterpart)sessionStorage.setItem('deviceFallback',selected.title);location.href=base+'mode='+mode+'&zoom='+zoom+'#'+destination}
function syncScroll(source,target){if(!linked||scrollLock)return;scrollLock=true;const xr=source.scrollWidth-source.clientWidth,yr=source.scrollHeight-source.clientHeight;target.scrollLeft=xr?source.scrollLeft/xr*(target.scrollWidth-target.clientWidth):0;target.scrollTop=yr?source.scrollTop/yr*(target.scrollHeight-target.clientHeight):0;requestAnimationFrame(()=>scrollLock=false)}
$('search').oninput=e=>renderNav(e.target.value);$('modes').onclick=e=>{if(e.target.dataset.mode)setMode(e.target.dataset.mode)};$('zooms').onclick=e=>{if(e.target.dataset.zoom){zoom=e.target.dataset.zoom;applyZoom()}};$('devices').onclick=e=>{if(e.target.dataset.device)switchDevice(e.target.dataset.device)};$('sync').onclick=()=>{linked=!linked;$('sync').textContent=linked?'Linked':'Unlinked';$('sync').setAttribute('aria-pressed',linked)};$('currentFrame').onscroll=()=>syncScroll($('currentFrame'),$('referenceFrame'));$('referenceFrame').onscroll=()=>syncScroll($('referenceFrame'),$('currentFrame'));addEventListener('resize',()=>{if(zoom==='fit')applyZoom()});addEventListener('hashchange',()=>openStory(location.hash.slice(1)));addEventListener('keydown',e=>{if(e.target.matches('input,button')||!['ArrowUp','ArrowDown'].includes(e.key))return;const i=stories.indexOf(selected)+(e.key==='ArrowDown'?1:-1);if(stories[i])openStory(stories[i].id)});document.querySelectorAll('#devices button').forEach(b=>{const active=b.dataset.device===device;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});renderNav();openStory(location.hash.slice(1));const fallback=sessionStorage.getItem('deviceFallback');if(fallback){sessionStorage.removeItem('deviceFallback');notify(fallback+' は '+device+' にないためHomeを表示しました')}
</script></body></html>
