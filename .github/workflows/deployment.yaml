name: Deployment
# Environment の deployment branch 規則は pull_request の merge ref を拒否するため、
# develop / master への push で起動する。push が「新しい PR マージ 1 回分」であることは、
# 秘密を持たない verify ジョブが確かめ、保護された testflight Environment の deploy へ SHA と PR だけを渡す。
on:
  push:
    branches: [develop, master]
    paths-ignore:
      - fastlane/testflight/last_shipped.json

permissions:
  contents: read

# ビルド番号の採番とアップロードが重ならないよう、全マージで同じグループを共有する。
concurrency:
  group: musicfin-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify merge
    if: github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      pr_number: ${{ steps.verify.outputs.pr_number }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # first parent との差分を取るため、親コミットまで取得する。
          fetch-depth: 2
          persist-credentials: false
      # 秘密は一切渡さない。ワークスペースを root 所有にしないよう呼び出し元の uid で走らせる。
      - name: Verify that this push is a new PR merge
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_TOKEN -e GITHUB_ACTIONS -e RUNNER_ENVIRONMENT -e GITHUB_EVENT_NAME -e GITHUB_REF \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW_REF \
            -e GITHUB_EVENT_PATH -e GITHUB_OUTPUT \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -w "${GITHUB_WORKSPACE}" \
            ruby:3.4.10@sha256:ce3b7a999d9e430e59e1a12456c631fbea3dd18948c89cf8a913c3566c77b2ae \
            ruby fastlane/lib/merge_verifier.rb

  deploy:
    name: Deploy to TestFlight
    needs: verify
    # 検証ジョブを再実行しない場合も、配信ジョブ自体で二重配信を止める。
    if: github.run_attempt == 1
    runs-on: [self-hosted, macOS, ARM64, macos-26]
    environment: testflight
    timeout-minutes: 45
    env:
      MUSICFIN_VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
      MUSICFIN_VERIFIED_PR: ${{ needs.verify.outputs.pr_number }}
      RBENV_VERSION: '3.4.10'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUNDLE_FROZEN: 'true'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          # 配信先ブランチが進んでも、イベントが指すマージ対象の内容だけをビルドする。
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Prepare VM Ruby and Fastlane
        # hosted 用 Ruby の固定パスに依存せず、検証済み VM の Ruby を使う。
        run: |
          ruby_bin="$HOME/.rbenv/versions/$RBENV_VERSION/bin"
          if [ ! -x "$ruby_bin/ruby" ]; then
            echo "::error::Ruby $RBENV_VERSION is missing at $ruby_bin"
            exit 1
          fi
          export GEM_HOME="$RUNNER_TEMP/musicfin-gems"
          export GEM_PATH="$GEM_HOME"
          export BUNDLE_PATH="$RUNNER_TEMP/musicfin-bundle"
          export PATH="$ruby_bin:$GEM_HOME/bin:$PATH"
          printf '%s\n' "$ruby_bin" "$GEM_HOME/bin" >> "$GITHUB_PATH"
          printf '%s\n' "GEM_HOME=$GEM_HOME" "GEM_PATH=$GEM_PATH" "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          ruby --version
          gem install bundler --version 4.0.16 --no-document
          bundle _4.0.16_ install --jobs 4 --retry 2
      - name: Validate merged deployment target
        run: bundle _4.0.16_ exec ruby fastlane/lib/deployment_policy.rb
      # 検証と準備がすべて終わった直後に、署名リポジトリの読み取りだけを持つ短命 token を発行する。
      # 鍵は入力としてだけ渡し、環境変数・GITHUB_ENV・CLI には出さない。post ステップが失効させる。
      - name: Create short-lived signing token
        id: signing-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MUSICFIN_MATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUSICFIN_MATCH_APP_PRIVATE_KEY }}
          owner: qtmleap
          repositories: match
          permission-contents: read
      - name: Deploy
        id: deploy
        env:
          ASC_KEY_ID: ${{ secrets.MUSICFIN_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.MUSICFIN_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.MUSICFIN_ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MUSICFIN_MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ steps.signing-token.outputs.token }}
        run: bundle _4.0.16_ exec fastlane beta
      - name: Preserve shipped build record
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-shipped-${{ needs.verify.outputs.sha }}
          path: fastlane/testflight/last_shipped.json
          if-no-files-found: error
          retention-days: 90
