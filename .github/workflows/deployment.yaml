name: Deployment
on:
  pull_request:
    branches: [develop, master]
    types: [closed]
    paths-ignore:
      - fastlane/testflight/last_shipped.json

permissions:
  contents: read

# ビルド番号の採番とアップロードが重ならないよう、全マージで同じグループを共有する。
concurrency:
  group: musicfin-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.merged == true &&
      contains(fromJSON('["develop","master"]'), github.event.pull_request.base.ref) &&
      github.ref == format('refs/heads/{0}', github.event.pull_request.base.ref) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # 配信先ブランチが進んでも、イベントが指すマージ対象の内容だけをビルドする。
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate merged deployment target
        run: ruby fastlane/lib/deployment_policy.rb
      - name: Deploy
        id: deploy
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: bundle exec fastlane beta
      - name: Preserve shipped build record
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-shipped-${{ github.event.pull_request.merge_commit_sha }}
          path: fastlane/testflight/last_shipped.json
          if-no-files-found: error
          retention-days: 90
