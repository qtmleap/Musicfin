name: Release Validation
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  validation:
    name: Validate marketing version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare marketing version with latest release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const project = fs.readFileSync('Musicfin.xcodeproj/project.pbxproj', 'utf8');
            const versions = [...new Set([...project.matchAll(/\bMARKETING_VERSION\s*=\s*"?([^";\s]+)"?\s*;/g)].map(match => match[1]))];
            if (versions.length !== 1) {
              throw new Error(`MARKETING_VERSION must have one consistent value: ${versions.join(', ')}`);
            }
            function parse(value) {
              const match = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(value);
              if (!match) throw new Error(`Invalid version: ${value}`);
              return { core: [match[1], match[2], match[3] || '0'].map(BigInt), pre: match[4]?.split('.') };
            }
            function compare(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a.core[i] !== b.core[i]) return a.core[i] > b.core[i] ? 1 : -1;
              }
              if (!a.pre || !b.pre) return a.pre ? -1 : b.pre ? 1 : 0;
              for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
                const x = a.pre[i], y = b.pre[i];
                if (x === y) continue;
                if (x === undefined || y === undefined) return x === undefined ? -1 : 1;
                const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
                if (nx && ny) {
                  if (BigInt(x) === BigInt(y)) continue;
                  return BigInt(x) > BigInt(y) ? 1 : -1;
                }
                if (nx !== ny) return nx ? -1 : 1;
                return x > y ? 1 : -1;
              }
              return 0;
            }
            const current = parse(versions[0]);
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease(context.repo)).data.tag_name;
            } catch (error) {
              // 初回リリースだけを許容し、認証失敗や通信障害を成功扱いにしない。
              if (error.status !== 404) throw error;
              core.info('No published release; version validation passed.');
              return;
            }
            if (compare(current, parse(latest)) <= 0) {
              throw new Error(`MARKETING_VERSION ${versions[0]} must be newer than ${latest}`);
            }
            core.info(`${versions[0]} is newer than ${latest}`);
