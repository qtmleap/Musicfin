name: Integration
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Musicfin.xcodeproj
  SCHEME: Musicfin

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '[".agents/skills/ios-development/SKILL.md",".agents/skills/ios-development/references/app-review-followup.md",".agents/skills/ios-development/references/release-policy.md",".agents/skills/ios-development/references/testing-policy.md","AGENTS.md","CLAUDE.md","docs/development/ci-change-scope.md","docs/development/ios-development-routine.md","docs/impl-brief.md","docs/superpowers/plans/2026-09-10-remaining-ui.md","docs/superpowers/plans/2026-10-06-recovery-and-develop-ci.md","docs/superpowers/plans/2026-10-11-album-overlay-continuity.md","docs/ui-consult-prompt.md","docs/ui-spec.md"]'
      doc-prefixes: '[]'
      runner: '["self-hosted","ubuntu-latest"]'

  commitlint:
    name: Commit Lint
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.action != 'closed' || github.event.pull_request.merged != true)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # PR のコミット範囲を確認できるよう、親コミットまで取得する。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        # act のホスト実行で、他の作業を含む共有キャッシュを圧縮しない。
        if: env.ACT != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install @commitlint/config-conventional@latest
          bun install commitlint@latest
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
      - name: Validate last commit
        if: github.event_name == 'workflow_dispatch'
        run: bunx commitlint --last --verbose

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Ensure ShellCheck
        # self-hosted のイメージ差で lint が起動できなくなることを避ける。
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "対象のスクリプトがありません。"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

  format:
    name: swift-format
    # swift-format は Xcode のツールチェーンに同梱されているため、macOS ランナーなら追加導入が要らない。
    runs-on: [self-hosted, macos-26]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift-format --version
      - name: swift-format lint
        run: |
          xcrun swift-format lint \
            --recursive --strict \
            --configuration .swift-format \
            Musicfin MusicfinUITests Tests

  build:
    needs: ["ci-change-scope"]
    name: Build
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '["self-hosted","macos-26"]') }}
    if: ${{ !cancelled() && (true) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          persist-credentials: false

      - name: Show toolchain
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS"

      - name: Build for iOS Simulator
        # 具体的な端末名ではなく generic 宛にビルドする。実機やシミュレータのランタイム構成に
        # 依存しないため、ランナーイメージが更新されても壊れない。
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Summarize warnings
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (always()) }}
        run: |
          # appintentsmetadataprocessor は AppIntents 未使用時に必ず出る無害な警告なので数えない。
          warnings=$(grep "warning:" build.log \
            | grep -v "appintentsmetadataprocessor" \
            | sort -u || true)
          count=$(printf '%s' "$warnings" | grep -c . || true)
          echo "警告: ${count} 件"
          [ "${count}" -gt 0 ] && printf '%s\n' "$warnings" | head -50
          {
            echo "### ビルド警告"
            echo
            if [ "${count}" -eq 0 ]; then
              echo "なし"
            else
              echo '```'
              printf '%s\n' "$warnings" | head -50
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload build log
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (failure() && env.ACT != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  unit-tests:
    needs: ["ci-change-scope"]
    name: Unit Tests
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '["self-hosted","macos-26"]') }}
    if: ${{ !cancelled() && (true) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          persist-credentials: false
      - name: Run unit tests
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: ./scripts/run-unit-tests.sh

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  actionlint:
    name: actionlint
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Lint workflows
        # npm を呼ぶラッパーに依存せず、ShellCheck と Python 検査を同梱した公式イメージを使う。
        run: |
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --workdir /work \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -verbose

  fastlane-tests:
    name: Fastlane Policy and Notes
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test deployment policy and TestFlight helpers
        uses: qtmleap/actions/actions/ruby-check@00c36aeda988735333907b407d98f6a4a9478b64
        with:
          command: 'for test in fastlane/test/*_test.rb; do ruby "$test"; done'
